<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Certificados - UPTPC</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" referrerpolicy="no-referrer" rel="stylesheet">

  <!-- Fuentes de Acceso Libre Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }
    .search-container {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-top: 60px;
    }
    .logo-uptpc {
      max-width: 200px;
      margin-bottom: 20px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0f3460, #16213e);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(15,52,96,0.4);
    }
    .btn-success {
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(40,167,69,0.4);
    }
    .card {
      border-radius: 15px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    .badge-tipo {
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .badge-cyt { background: #e3f2fd; color: #1565c0; }
    .badge-bienestar { background: #fce4ec; color: #c62828; }
    .badge-extension { background: #e8f5e9; color: #2e7d32; }

    /* ── Certificado Viewer ── */
    #cert-section {
      display: none;
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      padding: 30px;
      margin: 40px auto;
      max-width: 1200px;
      width: 95%;
    }
    #cert-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #cert-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow-x: auto;
      padding: 10px 0;
    }
    #certificado-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    #certificado-container svg {
      display: block;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      max-width: 100%;
      height: auto;
    }
    #progressContainer {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .loading-spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Print styles ── */
    @media print {
      body { background: white !important; }
      #search-section, #cert-buttons, #progressContainer { display: none !important; }
      #cert-section {
        display: block !important;
        background: white !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        width: 100% !important;
        box-shadow: none !important;
      }
      #cert-wrapper {
        overflow: visible !important;
        padding: 0 !important;
        align-items: flex-start !important;
      }
      #certificado-container svg {
        box-shadow: none !important;
        max-width: none !important;
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

<!-- ═══ BÚSQUEDA ═══ -->
<div class="container mt-4" id="search-section">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="search-container text-center">
        <img src="img/CYT.png" alt="UPTPC" class="logo-uptpc" onerror="this.style.display='none'">
        <h2 class="mb-1" style="color:#0f3460; font-weight:700;">Validador de Certificados</h2>
        <p class="text-muted mb-4">Universidad Politécnica Territorial de Puerto Cabello</p>

        <label for="busqueda" class="w-100 text-left">
          <p class="mb-2">Busca por <strong>Cédula (ej: V-12345678 o 12345678)</strong> o <strong>Código de Certificado (ej: HGQ5573DTY)</strong>:</p>
        </label>
        <input class="form-control form-control-lg text-center" id="busqueda"
               placeholder="V-12345678 o HGQ5573DTY" type="text">
        <button class="btn btn-primary btn-block mt-3" id="btnBuscar" onclick="buscarCertificado()">
          <i class="fas fa-search mr-2"></i>Buscar Certificado
        </button>

        <div id="resultados" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ CERTIFICADO ═══ -->
<div id="cert-section">
  <div id="cert-buttons">
    <button class="btn btn-primary" onclick="imprimirCertificado()">
      <i class="fa-solid fa-print mr-1"></i> Imprimir
    </button>
    <button class="btn btn-success" onclick="descargarPNG()">
      <i class="fa-solid fa-download mr-1"></i> Descargar PNG
    </button>
    <button class="btn btn-secondary" onclick="cerrarCertificado()">
      <i class="fa-solid fa-arrow-left mr-1"></i> Volver
    </button>
  </div>
  <div id="progressContainer">
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 75%;"></div>
    </div>
    <p class="text-center mt-2">Generando imagen...</p>
  </div>
  <div id="cert-wrapper">
    <div id="certificado-container"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/cert-renderer.js"></script>

<script>
// ============================================================
// CONSTANTES Y VARIABLES GLOBALES
// ============================================================
const API_URL = (window.config && window.config.getApiUrl) ? window.config.getApiUrl() : 'https://script.google.com/macros/s/AKfycbwZ7cn7EZvUiu1hWSNQp_HSTVYDBrYB9VqbnaW2eCUvdxRibStrWy31n_4mmEWoDNH2FQ/exec';

let ultimoTerminoBusqueda = "";
let disenoActivo = null;
let resultadosGuardados = [];
// Caché de diseños ya obtenidos por ID para no repetir fetches
const _cacheDisenos = {};

// ============================================================
// UTILIDADES INTERNAS
// ============================================================
const _esc = (t) => window.utils ? window.utils.escapeHtml(t) : String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const _fmtDate = (d) => window.utils ? window.utils.formatDate(d) : d;

async function _fetchJson(url) {
  const resp = await fetch(url);
  return resp.json();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  cargarDisenoActivo();

  const inputBusqueda = document.getElementById('busqueda');
  if (inputBusqueda) {
    inputBusqueda.addEventListener('input', () => {
      if (inputBusqueda.value.trim() !== ultimoTerminoBusqueda) {
        document.getElementById('resultados').innerHTML = '';
        document.getElementById('cert-section').style.display = 'none';
      }
      inputBusqueda.value = inputBusqueda.value.toUpperCase();
    });

    inputBusqueda.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') buscarCertificado();
    });
  }

  // Verificar parámetros URL al cargar (?ID=... o ?cedula=...)
  const urlParams = new URLSearchParams(window.location.search);
  const idParam = urlParams.get('ID');
  const cedulaParam = urlParams.get('cedula');
  if (idParam) {
    document.getElementById('busqueda').value = idParam;
    buscarCertificado();
  } else if (cedulaParam) {
    document.getElementById('busqueda').value = cedulaParam;
    buscarCertificado();
  }
});

// ============================================================
// CARGAR DISEÑO ACTIVO DE LA BASE DE DATOS
// ============================================================
async function cargarDisenoActivo() {
  try {
    const json = await _fetchJson(`${API_URL}?action=getDisenoActivo`);
    if (json.status === 'success' && json.data) {
      disenoActivo = json.data;
    }
  } catch(e) {
    console.log('No se pudo cargar diseño activo de la Base de Datos, se usará el diseño por defecto.');
  }
}

// ============================================================
// FUNCIÓN PRINCIPAL DE BÚSQUEDA
// ============================================================
async function buscarCertificado() {
  const terminoRaw = document.getElementById('busqueda').value.trim().toUpperCase();
  const resultadosDiv = document.getElementById('resultados');
  resultadosDiv.innerHTML = '';
  document.getElementById('cert-section').style.display = 'none';

  if (!terminoRaw) {
    resultadosDiv.innerHTML = '<div class="alert alert-warning mt-3"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Ingrese una cédula o código de certificado para buscar.</div>';
    return;
  }

  const termino = window.utils ? window.utils.normalizeCedula(terminoRaw) : terminoRaw;
  ultimoTerminoBusqueda = termino;

  const btnBuscar = document.getElementById('btnBuscar');
  btnBuscar.innerHTML = '<span class="loading-spinner mr-2"></span>Buscando en Base de Datos...';
  btnBuscar.disabled = true;

  try {
    let resultados = [];

    // 1. Intentar búsqueda con el término normalizado (Ej: V-12345678)
    const json = await _fetchJson(`${API_URL}?action=searchCertificado&termino=${encodeURIComponent(termino)}`);

    if (json.status === 'success' && Array.isArray(json.data)) {
      resultados = json.data;
    }

    // 2. Si no encontró resultados con la cédula normalizada y difiere del término crudo, probar con el término crudo
    if (resultados.length === 0 && termino !== terminoRaw) {
      const jsonRaw = await _fetchJson(`${API_URL}?action=searchCertificado&termino=${encodeURIComponent(terminoRaw)}`);
      if (jsonRaw.status === 'success' && Array.isArray(jsonRaw.data)) {
        resultados = jsonRaw.data;
      }
    }

    resultadosGuardados = resultados;

    if (resultados.length > 0) {
      mostrarResultados(resultados);

      // Registrar consulta en la bitácora (fire-and-forget)
      if (resultados[0] && resultados[0].id) {
        fetch(API_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'logConsulta', certificado_id: resultados[0].id })
        }).catch(() => {});
      }
    } else {
      resultadosDiv.innerHTML = '<div class="alert alert-danger mt-3"><i class="fa-solid fa-circle-exclamation mr-2"></i>No se encontraron certificados para: <strong>' + _esc(terminoRaw) + '</strong> en la Base de Datos.</div>';
    }
  } catch (error) {
    console.error('Error en búsqueda en La Base de Datos:', error);
    resultadosDiv.innerHTML = '<div class="alert alert-danger mt-3"><i class="fa-solid fa-circle-exclamation mr-2"></i>Error al consultar La Base de Datos. Intente nuevamente.</div>';
  } finally {
    btnBuscar.innerHTML = '<i class="fas fa-search mr-2"></i>Buscar Certificado';
    btnBuscar.disabled = false;
  }
}

// ============================================================
// MOSTRAR RESULTADOS
// ============================================================
function mostrarResultados(resultados) {
  const resultadosDiv = document.getElementById('resultados');
  const resultadosInvertidos = [...resultados].reverse();

  if (resultadosInvertidos.length === 1) {
    resultadosDiv.innerHTML = generarCardCertificado(resultadosInvertidos[0], 1);
  } else {
    let html = '<div class="list-group mt-3">';
    resultadosInvertidos.forEach((cert, i) => {
      html += generarCardCertificado(cert, i + 1);
    });
    html += '</div>';
    resultadosDiv.innerHTML = html;
  }
}

function generarCardCertificado(cert, numero) {
  const badgeClass = getBadgeClass(cert.unidad_codigo);

  let tomoFolioHtml = '';
  const hasTomo = cert.tomo && String(cert.tomo).trim() !== '';
  const hasFolio = cert.folio && String(cert.folio).trim() !== '';

  if (hasTomo || hasFolio) {
    const parts = [];
    if (hasTomo) parts.push(`<strong>Tomo:</strong> ${_esc(cert.tomo)}`);
    if (hasFolio) parts.push(`<strong>Folio:</strong> ${_esc(cert.folio)}`);
    tomoFolioHtml = `<br>${parts.join(' &nbsp;|&nbsp; ')}`;
  }

  let matriculaHtml = '';
  if (cert.matricula && String(cert.matricula).trim() !== '') {
    matriculaHtml = `<br><strong>Matrícula:</strong> ${_esc(cert.matricula)}`;
  }

  return `
    <div class="card mb-3 text-left">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="card-title mb-0"><b>${numero}.- ${_esc(cert.nombre_curso)}</b></h5>
          <span class="badge badge-tipo ${badgeClass}">${_esc(cert.unidad_codigo || 'CYT')}</span>
        </div>
        <p class="card-text">
          <strong>Nombre:</strong> ${_esc(cert.nombre_completo)}<br>
          <strong>Cédula:</strong> ${_esc(cert.cedula)}<br>
          <strong>Tipo:</strong> ${_esc(cert.tipo_curso || 'Taller')} &nbsp;|&nbsp; <strong>Horas:</strong> ${cert.horas || 0}<br>
          <strong>Fecha:</strong> ${_fmtDate(cert.fecha_curso)}<br>
          <strong>Código:</strong> <code>${_esc(cert.codigo)}</code>
          ${tomoFolioHtml}
          ${matriculaHtml}
        </p>
        <div class="text-center">
          <button class="btn btn-success" onclick="mostrarCertificado('${_esc(cert.codigo)}')">
            <i class="fa-solid fa-graduation-cap mr-1"></i> Generar Certificado
          </button>
        </div>
      </div>
    </div>
  `;
}

function getBadgeClass(codigo) {
  switch(codigo) {
    case 'CYT': return 'badge-cyt';
    case 'BIENESTAR': return 'badge-bienestar';
    case 'EXTENSION': return 'badge-extension';
    default: return 'badge-cyt';
  }
}

// ============================================================
// OBTENER DISEÑO PARA UN CERTIFICADO (CON CACHÉ)
// ============================================================
async function obtenerDisenoParaCertificadoConsulta(cert) {
  let disenoObj = null;

  const disenoId = cert ? (cert.diseno || cert.curso_diseno) : null;
  if (disenoId) {
    // Verificar caché primero
    if (_cacheDisenos[disenoId]) {
      return _cacheDisenos[disenoId];
    }
    try {
      const json = await _fetchJson(`${API_URL}?action=getById&tabla=disenos&id=${encodeURIComponent(disenoId)}`);
      if (json.status === 'success' && json.data) {
        disenoObj = json.data;
        _cacheDisenos[disenoId] = disenoObj;
      }
    } catch(e) {}
  }

  if (!disenoObj) {
    if (!disenoActivo) {
      await cargarDisenoActivo();
    }
    disenoObj = disenoActivo;
  }

  return disenoObj;
}

// ============================================================
// MOSTRAR CERTIFICADO SVG (TIRO Y RETIRO)
// ============================================================
async function mostrarCertificado(codigo) {
  try {
    let cert = resultadosGuardados.find(c => String(c.codigo).trim().toUpperCase() === String(codigo).trim().toUpperCase());

    if (!cert) {
      const json = await _fetchJson(`${API_URL}?action=searchCertificado&termino=${encodeURIComponent(codigo)}`);
      if (json.status === 'success' && Array.isArray(json.data) && json.data.length > 0) {
        cert = json.data[0];
      }
    }

    if (!cert) {
      alert('Certificado no encontrado en la Base de Datos');
      return;
    }

    const disenoObj = await obtenerDisenoParaCertificadoConsulta(cert);
    const tieneRetiro = window.certRenderer ? window.certRenderer.hasRetiro(disenoObj) : false;

    const contenedor = document.getElementById('certificado-container');
    
    if (tieneRetiro) {
      const tiroSVG = window.certRenderer.renderCertificateSVG(disenoObj, cert, false, 'tiro');
      const retiroSVG = window.certRenderer.renderCertificateSVG(disenoObj, cert, false, 'retiro');

      contenedor.innerHTML = `
        <div class="cert-pages" style="width:100%;">
          <div class="cert-page text-center mb-4">
            <span class="badge badge-primary px-3 py-2 fs-6 mb-2" style="background-color: #0f3460; color: white;"><i class="fa-solid fa-file-lines mr-1"></i> PARTE DE ADELANTE (TIRO)</span>
            <div class="border rounded p-2 bg-white shadow-sm mt-2">${tiroSVG}</div>
          </div>
          <div class="cert-page text-center">
            <span class="badge badge-secondary px-3 py-2 fs-6 mb-2" style="background-color: #424242; color: white;"><i class="fa-solid fa-file-lines mr-1"></i> PARTE DE ATRÁS (RETIRO)</span>
            <div class="border rounded p-2 bg-white shadow-sm mt-2">${retiroSVG}</div>
          </div>
        </div>
      `;
    } else {
      const tiroSVG = window.certRenderer.renderCertificateSVG(disenoObj, cert, false, 'tiro');
      contenedor.innerHTML = `<div class="p-2 bg-white rounded border shadow-sm">${tiroSVG}</div>`;
    }

    const certSection = document.getElementById('cert-section');
    certSection.style.display = 'block';
    certSection.scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    console.error('Error al generar certificado:', err);
    alert('Error al generar el certificado');
  }
}

// ============================================================
// IMPRIMIR CERTIFICADO (1 o 2 páginas)
// ============================================================
function imprimirCertificado() {
  const container = document.getElementById('certificado-container');
  const svgEls = container.querySelectorAll('svg');
  if (!svgEls || svgEls.length === 0) { alert('No hay certificado para imprimir'); return; }

  // Construir el HTML con page-break entre Tiro y Retiro
  let pagesHtml = '';
  svgEls.forEach((svgEl, idx) => {
    const svgStr = new XMLSerializer().serializeToString(svgEl);
    if (idx > 0) {
      pagesHtml += '<div style="page-break-before: always;"></div>';
    }
    pagesHtml += `<div style="display:flex;justify-content:center;align-items:center;min-height:100vh;">${svgStr}</div>`;
  });

  const printWin = window.open('', '_blank');
  printWin.document.write(`
    <html><head><title>Certificado UPTPC</title>
    <style>
      @page { size: landscape; margin: 0; }
      body { margin: 0; padding: 0; background: white; }
      svg { display: block; max-width: 100%; height: auto; }
    </style>
    </head><body>${pagesHtml}</body></html>
  `);
  printWin.document.close();
  printWin.focus();
  setTimeout(() => { printWin.print(); printWin.close(); }, 600);
}

// ============================================================
// DESCARGAR PNG (Tiro y Retiro como imágenes separadas)
// ============================================================

/**
 * Convierte una URL de imagen a base64 data URI.
 * Si falla (CORS, 404, etc.), devuelve la URL original.
 */
async function imageUrlToBase64(url) {
  try {
    // Si ya es data URI, no convertir
    if (url.startsWith('data:')) return url;

    // Resolver URLs relativas a absolutas
    const absoluteUrl = new URL(url, window.location.href).href;

    const resp = await fetch(absoluteUrl, { mode: 'cors' });
    if (!resp.ok) return url;
    const blob = await resp.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = () => resolve(url);
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    // Fallback: intentar con canvas para imágenes del mismo origen
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          resolve(c.toDataURL('image/png'));
        } catch (e2) { resolve(url); }
      };
      img.onerror = () => resolve(url);
      img.src = url.startsWith('data:') ? url : new URL(url, window.location.href).href;
    });
  }
}

/**
 * Clona un elemento SVG e incrusta todas sus <image> como base64 inline.
 * Retorna el SVG clonado listo para serializar.
 */
async function embedSvgImages(svgEl) {
  const clone = svgEl.cloneNode(true);
  const images = clone.querySelectorAll('image');

  const promises = Array.from(images).map(async (imgEl) => {
    const href = imgEl.getAttribute('href') || imgEl.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
    if (href && !href.startsWith('data:')) {
      const dataUri = await imageUrlToBase64(href);
      imgEl.setAttribute('href', dataUri);
      imgEl.removeAttributeNS('http://www.w3.org/1999/xlink', 'href');
    }
  });

  await Promise.all(promises);
  return clone;
}

async function descargarPNG() {
  const container = document.getElementById('certificado-container');
  const svgEls = container.querySelectorAll('svg');
  if (!svgEls || svgEls.length === 0) { alert('No hay certificado activo para descargar'); return; }

  document.getElementById('progressContainer').style.display = 'block';

  let processed = 0;
  const total = svgEls.length;

  for (let idx = 0; idx < svgEls.length; idx++) {
    const svgEl = svgEls[idx];
    const label = total > 1 ? (idx === 0 ? '_Tiro_Frente' : '_Retiro_Atras') : '';

    try {
      // Clonar SVG e incrustar imágenes como base64
      const embeddedSvg = await embedSvgImages(svgEl);
      const svgData = new XMLSerializer().serializeToString(embeddedSvg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const scale = 2;
          canvas.width = (svgEl.viewBox.baseVal.width || 1123) * scale;
          canvas.height = (svgEl.viewBox.baseVal.height || 794) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);

          const link = document.createElement('a');
          link.download = `Certificado${label}_${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          resolve();
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
          reject(new Error('Error al renderizar SVG'));
        };
        img.src = url;
      });
    } catch (err) {
      console.warn('Error descargando PNG:', err);
    }

    processed++;
    if (processed >= total) {
      document.getElementById('progressContainer').style.display = 'none';
    }
  }
}

function cerrarCertificado() {
  document.getElementById('cert-section').style.display = 'none';
  document.getElementById('certificado-container').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Certificados - UPTPC</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" referrerpolicy="no-referrer" rel="stylesheet">

  <!-- Fuentes de Acceso Libre Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }
    .search-container {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-top: 60px;
    }
    .logo-uptpc {
      max-width: 200px;
      margin-bottom: 20px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0f3460, #16213e);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(15,52,96,0.4);
    }
    .btn-success {
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(40,167,69,0.4);
    }
    .card {
      border-radius: 15px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    .badge-tipo {
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .badge-cyt { background: #e3f2fd; color: #1565c0; }
    .badge-bienestar { background: #fce4ec; color: #c62828; }
    .badge-extension { background: #e8f5e9; color: #2e7d32; }

    /* ── Certificado Viewer ── */
    #cert-section {
      display: none;
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      padding: 30px;
      margin: 40px auto;
      max-width: 1200px;
      width: 95%;
    }
    #cert-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #cert-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow-x: auto;
      padding: 10px 0;
    }
    #certificado-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    #certificado-container svg {
      display: block;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      max-width: 100%;
      height: auto;
    }
    #progressContainer {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .loading-spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Print styles ── */
    @media print {
      body { background: white !important; }
      #search-section, #cert-buttons, #progressContainer { display: none !important; }
      #cert-section {
        display: block !important;
        background: white !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        width: 100% !important;
        box-shadow: none !important;
      }
      #cert-wrapper {
        overflow: visible !important;
        padding: 0 !important;
        align-items: flex-start !important;
      }
      #certificado-container svg {
        box-shadow: none !important;
        max-width: none !important;
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

<!-- ═══ BÚSQUEDA ═══ -->
<div class="container mt-4" id="search-section">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="search-container text-center">
        <img src="https://tuyatgbswyaaetytathd.supabase.co/storage/v1/object/public/logos/UPTPC_LOGO.png" alt="UPTPC" class="logo-uptpc" onerror="this.style.display='none'">
        <h2 class="mb-1" style="color:#0f3460; font-weight:700;">Validador de Certificados</h2>
        <p class="text-muted mb-4">Universidad Politécnica Territorial de Puerto Cabello</p>

        <label for="busqueda" class="w-100 text-left">
          <p class="mb-2">Busca por <strong>Cédula (ej: V-12345678)</strong> o <strong>Código de Certificado (ej: HGQ5573DTY)</strong>:</p>
        </label>
        <input class="form-control form-control-lg text-center" id="busqueda"
               placeholder="V-12345678 o HGQ5573DTY" type="text"
               pattern="[^\s]+" oninput="this.value = this.value.replace(/\s/g, '')">
        <button class="btn btn-primary btn-block mt-3" id="btnBuscar" onclick="buscarCertificado()">
          <i class="fas fa-search mr-2"></i>Buscar Certificado
        </button>

        <div id="resultados" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ CERTIFICADO ═══ -->
<div id="cert-section">
  <div id="cert-buttons">
    <button class="btn btn-primary" onclick="window.print()">
      <i class="fa-solid fa-print mr-1"></i> Imprimir
    </button>
    <button class="btn btn-success" onclick="descargarPNG()">
      <i class="fa-solid fa-download mr-1"></i> Descargar PNG
    </button>
    <button class="btn btn-secondary" onclick="cerrarCertificado()">
      <i class="fa-solid fa-arrow-left mr-1"></i> Volver
    </button>
  </div>
  <div id="progressContainer">
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 75%;"></div>
    </div>
    <p class="text-center mt-2">Generando imagen...</p>
  </div>
  <div id="cert-wrapper">
    <div id="certificado-container"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN DE GOOGLE APPS SCRIPT API
// ============================================================
const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEIHa8gnLa-v_NpwfDxNRg72UCHUrltJKP5EE65yWkcGjs9G5LO_53VyS7TaI6nLhX4g/exec';
const GOOGLE_SCRIPT_URL = localStorage.getItem('uptpc_google_script_url') || DEFAULT_SCRIPT_URL;

// URL base para verificación de certificados
const URL_VERIFICACION = 'https://www.jornaltec.uptpc.edu.ve/p/validador-de-certificados.html';

// ============================================================
// VARIABLES GLOBALES
// ============================================================
let ultimoTerminoBusqueda = "";
let disenoActivo = null;
let resultadosGuardados = [];

// ============================================================
// EVENT LISTENERS
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  cargarDisenoActivo();
});

const inputBusqueda = document.getElementById('busqueda');
inputBusqueda.addEventListener('input', () => {
  if (inputBusqueda.value.trim() !== ultimoTerminoBusqueda) {
    document.getElementById('resultados').innerHTML = '';
    document.getElementById('cert-section').style.display = 'none';
  }
  inputBusqueda.value = inputBusqueda.value.toUpperCase();
});

// Enter para buscar
inputBusqueda.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') buscarCertificado();
});

// Verificar parámetros URL al cargar
document.addEventListener('DOMContentLoaded', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const idParam = urlParams.get('ID');
  const cedulaParam = urlParams.get('cedula');
  if (idParam) {
    document.getElementById('busqueda').value = idParam;
    buscarCertificado();
  } else if (cedulaParam) {
    document.getElementById('busqueda').value = cedulaParam;
    buscarCertificado();
  }
});

// ============================================================
// FUNCIÓN PRINCIPAL DE BÚSQUEDA
// ============================================================
async function buscarCertificado() {
  const termino = document.getElementById('busqueda').value.trim().toUpperCase();
  const resultadosDiv = document.getElementById('resultados');
  resultadosDiv.innerHTML = '';
  document.getElementById('cert-section').style.display = 'none';

  if (!termino) {
    resultadosDiv.innerHTML = '<div class="alert alert-warning mt-3"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Ingrese una cédula o código de certificado para buscar.</div>';
    return;
  }

  ultimoTerminoBusqueda = termino;

  // Mostrar spinner
  document.getElementById('btnBuscar').innerHTML = '<span class="loading-spinner mr-2"></span>Buscando en Base de Datos...';
  document.getElementById('btnBuscar').disabled = true;

  try {
    let resultados = [];

    // Consulta a Google Apps Script API (Backend Google Sheets)
    const resp = await fetch(`${GOOGLE_SCRIPT_URL}?action=searchCertificado&termino=${encodeURIComponent(termino)}`);
    const json = await resp.json();

    if (json.status === 'success' && json.data) {
      resultados = json.data;
    }

    resultadosGuardados = resultados;

    if (resultados.length > 0) {
      mostrarResultados(resultados);

      // Registrar consulta en bitácora
      if (resultados[0] && resultados[0].id) {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'logConsulta', certificado_id: resultados[0].id })
        }).catch(() => {});
      }
    } else {
      resultadosDiv.innerHTML = '<div class="alert alert-danger mt-3"><i class="fa-solid fa-circle-exclamation mr-2"></i>No se encontraron certificados para: <strong>' + escapeHtml(termino) + '</strong> en la Base de Datos.</div>';
    }
  } catch (error) {
    console.error('Error en búsqueda en La Base de Datos:', error);
    resultadosDiv.innerHTML = '<div class="alert alert-danger mt-3"><i class="fa-solid fa-circle-exclamation mr-2"></i>Error al consultar La Base de Datos. Intente nuevamente.</div>';
  } finally {
    document.getElementById('btnBuscar').innerHTML = '<i class="fas fa-search mr-2"></i>Buscar Certificado';
    document.getElementById('btnBuscar').disabled = false;
  }
}

// ============================================================
// NORMALIZAR CÉDULA
// ============================================================
function normalizarCedula(cedula) {
  let c = cedula.trim().toUpperCase();
  if (/^[VE]\d{5,8}$/.test(c)) {
    c = c.charAt(0) + '-' + c.substring(1);
  }
  return c;
}

// ============================================================
// MOSTRAR RESULTADOS
// ============================================================
function mostrarResultados(resultados) {
  const resultadosDiv = document.getElementById('resultados');
  const resultadosInvertidos = [...resultados].reverse();

  if (resultadosInvertidos.length === 1) {
    const cert = resultadosInvertidos[0];
    resultadosDiv.innerHTML = generarCardCertificado(cert, 1);
  } else {
    let html = '<div class="list-group mt-3">';
    let n = 1;
    resultadosInvertidos.forEach(cert => {
      html += generarCardCertificado(cert, n);
      n++;
    });
    html += '</div>';
    resultadosDiv.innerHTML = html;
  }
}

function generarCardCertificado(cert, numero) {
  const badgeClass = getBadgeClass(cert.unidad_codigo);

  let tomoFolioHtml = '';
  const hasTomo = cert.tomo && String(cert.tomo).trim() !== '';
  const hasFolio = cert.folio && String(cert.folio).trim() !== '';

  if (hasTomo || hasFolio) {
    const parts = [];
    if (hasTomo) parts.push(`<strong>Tomo:</strong> ${escapeHtml(cert.tomo)}`);
    if (hasFolio) parts.push(`<strong>Folio:</strong> ${escapeHtml(cert.folio)}`);
    tomoFolioHtml = `<br>${parts.join(' &nbsp;|&nbsp; ')}`;
  }

  let matriculaHtml = '';
  const hasMatricula = cert.matricula && String(cert.matricula).trim() !== '';
  if (hasMatricula) {
    matriculaHtml = `<br><strong>Matrícula:</strong> ${escapeHtml(cert.matricula)}`;
  }

  return `
    <div class="card mb-3 text-left">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="card-title mb-0"><b>${numero}.- ${escapeHtml(cert.nombre_curso)}</b></h5>
          <span class="badge badge-tipo ${badgeClass}">${escapeHtml(cert.unidad_codigo || 'CYT')}</span>
        </div>
        <p class="card-text">
          <strong>Nombre:</strong> ${escapeHtml(cert.nombre_completo)}<br>
          <strong>Cédula:</strong> ${escapeHtml(cert.cedula)}<br>
          <strong>Tipo:</strong> ${escapeHtml(cert.tipo_curso || 'Taller')} &nbsp;|&nbsp; <strong>Horas:</strong> ${cert.horas || 0}<br>
          <strong>Fecha:</strong> ${formatearFecha(cert.fecha_curso)}<br>
          <strong>Código:</strong> <code>${escapeHtml(cert.codigo)}</code>
          ${tomoFolioHtml}
          ${matriculaHtml}
        </p>
        <div class="text-center">
          <button class="btn btn-success" onclick="mostrarCertificado('${escapeHtml(cert.codigo)}')">
            <i class="fa-solid fa-graduation-cap mr-1"></i> Generar Certificado
          </button>
        </div>
      </div>
    </div>
  `;
}

function getBadgeClass(codigo) {
  switch(codigo) {
    case 'CYT': return 'badge-cyt';
    case 'BIENESTAR': return 'badge-bienestar';
    case 'EXTENSION': return 'badge-extension';
    default: return 'badge-cyt';
  }
}

// ============================================================
// CARGAR DISEÑO ACTIVO DESDE
// ============================================================
async function cargarDisenoActivo() {
  try {
    const resp = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDisenoActivo`);
    const json = await resp.json();
    if (json.status === 'success' && json.data) {
      disenoActivo = json.data;
    }
  } catch(e) {
    console.log('No se pudo cargar diseño activo de La Base de Datos, usando diseño por defecto');
  }
}

// ============================================================
// RESOLVER BINDING DE DATOS
// ============================================================
function resolverBinding(binding, cert) {
  if (!binding) return null;
  switch (binding) {
    case 'nombre_completo': return cert.nombre_completo || '';
    case 'cedula': return cert.cedula || '';
    case 'cedula_label': return cert.cedula ? 'Cédula de Identidad: ' + cert.cedula : '';
    case 'unidad_nombre': return cert.unidad_nombre || '';
    case 'motivo': return cert.motivo || '';
    case 'ponencias': return cert.ponencias || cert.contenido || '';
    case 'tipo_horas': {
      var parts = [];
      if (cert.tipo_curso) parts.push('Tipo: ' + cert.tipo_curso);
      if (cert.horas) parts.push('Horas Académicas: ' + cert.horas);
      return parts.join('  |  ');
    }
    case 'tomo_folio': {
      var parts = [];
      if (cert.tomo && String(cert.tomo).trim() !== '') parts.push('Tomo: ' + cert.tomo);
      if (cert.folio && String(cert.folio).trim() !== '') parts.push('Folio: ' + cert.folio);
      return parts.join('  |  ');
    }
    case 'matricula': return (cert.matricula && String(cert.matricula).trim() !== '') ? 'Matrícula: ' + cert.matricula : '';
    case 'lugar': return cert.lugar || '';
    case 'codigo_label': return cert.codigo ? 'Código de Verificación: ' + cert.codigo : '';
    case 'url_verificacion': return URL_VERIFICACION + '?ID=' + (cert.codigo || '');
    case 'qr_url': return URL_VERIFICACION + '?ID=' + (cert.codigo || '');
    case 'logo_url': return cert.logo_url || '';
    case 'logo_universidad': return 'https://tuyatgbswyaaetytathd.supabase.co/storage/v1/object/public/logos/UPTPC_LOGO.png';
    case 'curso_nombre': return cert.nombre_curso || '';
    case 'fecha_curso': return cert.fecha_curso ? formatearFechaExtendida(cert.fecha_curso) : '';
    case 'se_certifica': return 'Se certifica que:';

    // Firmante 1
    case 'firma1_nombre': return cert.firma1_nombre || '';
    case 'firma1_cargo': return cert.firma1_cargo || '';
    case 'firma1_url': return cert.firma1_url || cert.firma1_firma || '';
    case 'sello1_url': return cert.sello1_url || cert.firma1_sello || '';

    // Firmante 2
    case 'firma2_nombre': return cert.firma2_nombre || '';
    case 'firma2_cargo': return cert.firma2_cargo || '';
    case 'firma2_url': return cert.firma2_url || cert.firma2_firma || '';
    case 'sello2_url': return cert.sello2_url || cert.firma2_sello || '';

    // Firmante 3
    case 'firma3_nombre': return cert.firma3_nombre || '';
    case 'firma3_cargo': return cert.firma3_cargo || '';
    case 'firma3_url': return cert.firma3_url || cert.firma3_firma || '';
    case 'sello3_url': return cert.sello3_url || cert.firma3_sello || '';

    default: return cert[binding] || '';
  }
}

// ============================================================
// GENERAR SVG DESDE DISEÑO (JSON DE BD)
// ============================================================
function generarSVGDesdeDiseno(diseno, cert) {
  const elementos = diseno.elementos || [];
  const marco = diseno.marco || {};
  const fondo = diseno.fondo || {};

  const svgWidth = diseno.ancho || 1123;
  const svgHeight = diseno.alto || 794;

  let defsContent = '';
  let bodyContent = '';
  let textoMultilineaPendientes = [];

  if (fondo.gradiente) {
    const g = fondo.gradiente;
    defsContent += '<linearGradient id="bgGrad" x1="' + g.x1 + '" y1="' + g.y1 + '" x2="' + g.x2 + '" y2="' + g.y2 + '">';
    defsContent += '<stop offset="0%" style="stop-color:' + g.startColor + ';stop-opacity:' + g.startOpacity + '" />';
    defsContent += '<stop offset="100%" style="stop-color:' + g.endColor + ';stop-opacity:' + g.endOpacity + '" />';
    defsContent += '</linearGradient>';
  }

  bodyContent += '<rect width="' + svgWidth + '" height="' + svgHeight + '" fill="' + (fondo.color || '#FFFFFF') + '"/>';

  if (marco.exterior) {
    const e = marco.exterior;
    bodyContent += '<rect x="' + e.x + '" y="' + e.y + '" width="' + e.ancho + '" height="' + e.alto + '" rx="' + (e.rx || 0) + '" ry="' + (e.ry || e.rx || 0) + '" fill="none" stroke="' + e.stroke + '" stroke-width="' + e.strokeWidth + '"/>';
  }

  if (marco.interior) {
    const i = marco.interior;
    const dashAttr = i.strokeDasharray ? ' stroke-dasharray="' + i.strokeDasharray + '"' : '';
    bodyContent += '<rect x="' + i.x + '" y="' + i.y + '" width="' + i.ancho + '" height="' + i.alto + '" rx="' + (i.rx || 0) + '" ry="' + (i.ry || i.rx || 0) + '" fill="none" stroke="' + i.stroke + '" stroke-width="' + i.strokeWidth + '"' + dashAttr + '/>';
  }

  if (marco.esquinas) {
    marco.esquinas.forEach(function(esq) {
      bodyContent += '<path d="' + esq.path + '" fill="none" stroke="' + esq.stroke + '" stroke-width="' + esq.strokeWidth + '" opacity="' + (esq.opacity || 1) + '"/>';
    });
  }

  if (fondo.gradiente && marco.interior) {
    const i = marco.interior;
    bodyContent += '<rect x="' + (i.x + 2) + '" y="' + (i.y + 2) + '" width="' + (i.ancho - 4) + '" height="' + (i.alto - 4) + '" rx="' + Math.max(0, (i.rx || 0) - 1) + '" ry="' + Math.max(0, (i.ry || i.rx || 0) - 1) + '" fill="url(#bgGrad)"/>';
  }

  var elemIdx = 0;
  elementos.forEach(function(el) {
    var estilo = el.estilo || {};

    switch (el.tipo) {
      case 'texto':
      case 'texto_multilinea': {
        var textoVal = '';
        if (el.binding) {
          textoVal = resolverBinding(el.binding, cert) || '';
        }
        if (!textoVal && el.texto_fijo) {
          textoVal = el.texto_fijo;
        }

        var ta = estilo.textAnchor || (estilo.textAlign === 'center' ? 'middle' : estilo.textAlign === 'right' ? 'end' : 'start');
        var ff = estilo.fontFamily || 'Arial, sans-serif';
        var fs = estilo.fontSize || 16;
        var fw = estilo.fontWeight || 'normal';
        var fill = estilo.fill || estilo.color || '#000000';
        var ls = estilo.letterSpacing || 0;
        var op = estilo.opacity !== undefined ? estilo.opacity : 1;
        var anchoMax = el.ancho || 200;

        if (textoVal) {
          var gId = 'wrap-text-' + elemIdx;
          textoMultilineaPendientes.push({
            id: gId,
            texto: textoVal,
            x: el.x,
            y: el.y,
            ancho: anchoMax,
            estilo: { textAnchor: ta, fontFamily: ff, fontSize: fs, fontWeight: fw, fill: fill, letterSpacing: ls, opacity: op }
          });
          bodyContent += '<g id="' + gId + '"></g>';
        }
        break;
      }

      case 'imagen': {
        var href = '';
        if (el.binding) href = resolverBinding(el.binding, cert) || '';
        if (!href && el.texto_fijo) href = el.texto_fijo;
        if (!href) break;

        var imgAttrs = estilo.preserveAspectRatio ? ' preserveAspectRatio="' + estilo.preserveAspectRatio + '"' : ' preserveAspectRatio="xMidYMid meet"';
        if (estilo.opacity !== undefined) imgAttrs += ' opacity="' + estilo.opacity + '"';

        bodyContent += '<image href="' + href + '" x="' + el.x + '" y="' + el.y + '" width="' + el.ancho + '" height="' + el.alto + '"' + imgAttrs + ' onerror="this.style.display=\'none\'"/>';
        break;
      }

      case 'linea': {
        var lineAttrs = '';
        if (estilo.stroke) lineAttrs += ' stroke="' + estilo.stroke + '"';
        if (estilo.strokeWidth) lineAttrs += ' stroke-width="' + estilo.strokeWidth + '"';
        if (estilo.opacity !== undefined) lineAttrs += ' opacity="' + estilo.opacity + '"';
        if (estilo.strokeDasharray) lineAttrs += ' stroke-dasharray="' + estilo.strokeDasharray + '"';

        bodyContent += '<line x1="' + el.x + '" y1="' + el.y + '" x2="' + (el.x + el.ancho) + '" y2="' + (el.y + el.alto) + '"' + lineAttrs + '/>';
        break;
      }

      case 'qr': {
        var qrUrl = el.binding ? resolverBinding(el.binding, cert) : '';
        if (!qrUrl && el.texto_fijo) qrUrl = el.texto_fijo;
        if (qrUrl) {
          var qrSize = el.ancho || 80;
          var qrSVGContent = generateQRCodeSVG(qrUrl, qrSize);
          bodyContent += '<g transform="translate(' + el.x + ', ' + el.y + ')"><rect width="' + qrSize + '" height="' + (el.alto || qrSize) + '" fill="white"/>' + qrSVGContent + '</g>';
        }
        break;
      }

      case 'rectangulo': {
        var rectAttrs = '';
        var rfill = estilo.fill || 'none';
        var rstroke = estilo.stroke || '#000000';
        var rsw = estilo.strokeWidth || 2;
        rectAttrs += ' fill="' + rfill + '" stroke="' + rstroke + '" stroke-width="' + rsw + '"';
        if (estilo.opacity !== undefined) rectAttrs += ' opacity="' + estilo.opacity + '"';
        if (estilo.rx) rectAttrs += ' rx="' + estilo.rx + '"';
        if (estilo.ry) rectAttrs += ' ry="' + estilo.ry + '"';
        bodyContent += '<rect x="' + el.x + '" y="' + el.y + '" width="' + el.ancho + '" height="' + el.alto + '"' + rectAttrs + '/>';
        break;
      }
    }
    elemIdx++;
  });

  window._textoMultilineaPendientes = textoMultilineaPendientes.length > 0 ? textoMultilineaPendientes : null;

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" id="certificadoSVG" viewBox="0 0 ' + svgWidth + ' ' + svgHeight + '"';
  svg += ' width="' + svgWidth + '" height="' + svgHeight + '"';
  svg += ' style="display:block;max-width:100%;height:auto;">';
  svg += '<defs>';
  svg += defsContent;
  svg += '</defs>';
  svg += bodyContent;
  svg += '</svg>';

  return svg;
}

async function mostrarCertificado(codigo) {
  try {
    let cert = resultadosGuardados.find(c => String(c.codigo).toUpperCase() === String(codigo).toUpperCase());

    if (!cert) {
      const resp = await fetch(`${GOOGLE_SCRIPT_URL}?action=searchCertificado&termino=${encodeURIComponent(codigo)}`);
      const json = await resp.json();
      if (json.status === 'success' && json.data && json.data.length > 0) {
        cert = json.data[0];
      }
    }

    if (!cert) {
      alert('Certificado no encontrado');
      return;
    }

    const svg = generarSVGCertificado(cert);
    const contenedor = document.getElementById('certificado-container');
    contenedor.innerHTML = svg;

    setTimeout(function() {
      document.getElementById('cert-section').style.display = 'block';
      document.getElementById('cert-section').scrollIntoView({ behavior: 'smooth' });

      if (window._textoMultilineaPendientes && window._textoMultilineaPendientes.length > 0) {
        window._textoMultilineaPendientes.forEach(function(item) {
          var el = document.getElementById(item.id);
          if (el && item.texto) {
            var estilo = item.estilo || {};
            renderWrappedText(item.texto, item.x, item.y, item.ancho, el, estilo);
          }
        });
        window._textoMultilineaPendientes = null;
      }
      var motivoDiv = document.getElementById('motivo');
      var contenidoDiv = document.getElementById('contenido');
      if (motivoDiv && cert.motivo) {
        agregarTextoMultilinea(cert.motivo, 0, 0, 580, motivoDiv);
      }
      if (contenidoDiv && cert.ponencias) {
        agregarTextoMultilinea(cert.ponencias, 0, 0, 150, contenidoDiv);
      }
    }, 200);

  } catch (err) {
    console.error('Error al generar certificado:', err);
    alert('Error al generar el certificado');
  }
}

function renderWrappedText(texto, elX, elY, anchoMaximo, svgGroup, estilo) {
  estilo = estilo || {};
  var fontSize = estilo.fontSize || 16;
  var fontFamily = estilo.fontFamily || 'Arial, sans-serif';
  var fill = estilo.fill || estilo.color || '#000000';
  var fontWeight = estilo.fontWeight || 'normal';
  var ta = estilo.textAnchor || (estilo.textAlign === 'center' ? 'middle' : estilo.textAlign === 'right' ? 'end' : 'start');
  var letterSpacing = estilo.letterSpacing || 0;
  var opacity = estilo.opacity !== undefined ? estilo.opacity : 1;
  var lineHeight = fontSize * 1.3;

  var xPos = elX;
  if (ta === 'middle') xPos = elX + anchoMaximo / 2;
  else if (ta === 'end') xPos = elX + anchoMaximo;

  var textoLimpio = texto.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; }).join('\n');
  var parrafos = textoLimpio.split('\n');
  var lineasWrapped = [];

  var mainSVG = svgGroup;
  while (mainSVG && mainSVG.tagName && mainSVG.tagName.toLowerCase() !== 'svg') {
    mainSVG = mainSVG.parentNode;
  }
  if (!mainSVG) mainSVG = svgGroup;

  var fontStyle = estilo.fontStyle || 'normal';

  parrafos.forEach(function(parrafo) {
    var palabras = parrafo.split(' ');
    var lineaActual = '';

    for (var i = 0; i < palabras.length; i++) {
      var textoPrueba = lineaActual + (lineaActual.length > 0 ? ' ' : '') + palabras[i];

      var tempText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tempText.setAttribute('font-size', fontSize + 'px');
      tempText.setAttribute('font-family', fontFamily);
      tempText.setAttribute('font-weight', fontWeight);
      tempText.setAttribute('font-style', fontStyle);
      if (letterSpacing > 0) tempText.setAttribute('letter-spacing', letterSpacing);
      tempText.textContent = textoPrueba;
      mainSVG.appendChild(tempText);
      var anchoMedido = tempText.getComputedTextLength();
      mainSVG.removeChild(tempText);

      if (anchoMedido > anchoMaximo && lineaActual.length > 0) {
        lineasWrapped.push(lineaActual);
        lineaActual = palabras[i];
      } else {
        lineaActual = textoPrueba;
      }
    }
    if (lineaActual) lineasWrapped.push(lineaActual);
  });

  var textoSVG = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  textoSVG.setAttribute('text-anchor', ta);
  textoSVG.setAttribute('font-size', fontSize + 'px');
  textoSVG.setAttribute('font-family', fontFamily);
  textoSVG.setAttribute('font-weight', fontWeight);
  textoSVG.setAttribute('font-style', fontStyle);
  textoSVG.setAttribute('fill', fill);
  textoSVG.setAttribute('opacity', opacity);
  if (letterSpacing > 0) textoSVG.setAttribute('letter-spacing', letterSpacing);

  lineasWrapped.forEach(function(linea, index) {
    var tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    tspan.textContent = linea;
    tspan.setAttribute('x', xPos);
    tspan.setAttribute('y', elY + fontSize + index * lineHeight);
    textoSVG.appendChild(tspan);
  });

  svgGroup.appendChild(textoSVG);
}

function agregarTextoMultilinea(texto, x, y, anchoMaximo, svg) {
  renderWrappedText(texto, x, y, anchoMaximo, svg, {
    fontSize: 16,
    textAnchor: 'middle',
    fill: '#000000',
    fontWeight: 'normal'
  });
}

function generateQRCodeSVG(text, size) {
  size = size || 80;
  var qr = new QRCode(5, 2);
  try { qr.addData(text); qr.make(); } catch(e) {
    try { qr = new QRCode(10, 2); qr.addData(text); qr.make(); } catch(e2) {
      try { qr = new QRCode(20, 2); qr.addData(text); qr.make(); } catch(e3) { return ''; }
    }
  }
  var mc = qr.getModuleCount();
  var cellSize = size / mc;
  var svg = '';
  for (var row = 0; row < mc; row++) {
    for (var col = 0; col < mc; col++) {
      if (qr.isDark(row, col)) {
        var x = Math.round(col * cellSize * 100) / 100;
        var y = Math.round(row * cellSize * 100) / 100;
        var w = Math.round((col + 1) * cellSize * 100) / 100 - x;
        var h = Math.round((row + 1) * cellSize * 100) / 100 - y;
        svg += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#000"/>';
      }
    }
  }
  return svg;
}

// UTILIDADES UTILIZADAS POR EL CLIENTE
function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return '';
  try {
    var d = new Date(fechaStr + 'T00:00:00');
    return d.toLocaleDateString('es-VE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch(e) { return fechaStr; }
}

function formatearFechaExtendida(fechaStr) {
  if (!fechaStr) return '';
  try {
    var d = new Date(fechaStr + 'T00:00:00');
    var meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
    return d.getDate() + ' DE ' + meses[d.getMonth()] + ' DE ' + d.getFullYear();
  } catch(e) { return fechaStr; }
}

function descargarPNG() {
  var container = document.getElementById('certificado-container');
  var svgEl = container.querySelector('svg');
  if (!svgEl) { alert('No hay certificado para descargar'); return; }

  document.getElementById('progressContainer').style.display = 'block';

  var svgData = new XMLSerializer().serializeToString(svgEl);
  var svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  var url = URL.createObjectURL(svgBlob);

  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var scale = 2;
    canvas.width = svgEl.viewBox.baseVal.width * scale;
    canvas.height = svgEl.viewBox.baseVal.height * scale;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);

    var link = document.createElement('a');
    link.download = 'certificado.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    document.getElementById('progressContainer').style.display = 'none';
  };
  img.onerror = function() {
    alert('No se pudo generar la imagen. Intente usar Imprimir.');
    document.getElementById('progressContainer').style.display = 'none';
  };
  img.src = url;
}

function cerrarCertificado() {
  document.getElementById('cert-section').style.display = 'none';
  document.getElementById('certificado-container').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor PDF con efecto hover</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: #34495e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        /* FIX: los indicadores viven aquí, FUERA de #flipbook.
           Turn.js trata cada hijo del flipbook como una página. */
        .flipbook-wrapper {
            position: relative;
            width: 800px;
            margin: 0 auto;
        }
        
        #flipbook {
            width: 800px;
            height: 500px;
            background: #ecf0f1;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        
        /* FIX: sin transform ni transition en .turn-page,
           interfieren con las transformaciones inline de turn.js */
        .turn-page {
            background-color: white;
            border: 1px solid #bdc3c7;
            overflow: hidden;
        }
        
        .hover-indicator {
            position: absolute;
            top: 0;
            width: 60px;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .hover-indicator.left {
            left: 0;
            background: linear-gradient(to right, rgba(52, 152, 219, 0.35), transparent);
        }
        
        .hover-indicator.right {
            right: 0;
            background: linear-gradient(to left, rgba(52, 152, 219, 0.35), transparent);
        }
        
        .flipbook-wrapper.hover-left .hover-indicator.left,
        .flipbook-wrapper.hover-right .hover-indicator.right {
            opacity: 1;
        }
        
        .flipbook-wrapper.hover-left #flipbook { cursor: w-resize; }
        .flipbook-wrapper.hover-right #flipbook { cursor: e-resize; }
        
        .pdf-page {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;      /* que la img no interfiera con los eventos */
            -webkit-user-drag: none;   /* evita el drag "fantasma" de la imagen */
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .page-info {
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="flipbook-wrapper">
            <div id="flipbook">
                <div class="loading">Cargando PDF...</div>
            </div>
            <div class="hover-indicator left"></div>
            <div class="hover-indicator right"></div>
        </div>
        
        <div class="controls">
            <button id="prev-page" disabled>← Anterior</button>
            <button id="next-page" disabled>Siguiente →</button>
        </div>
        
        <div class="page-info" id="page-info">
            Página 1 de <span id="total-pages">0</span>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            
            const pdfUrl = 'https://pub-1a8a6736c07b4083b58438c05d3c94b6.r2.dev/archivo_comprimido.pdf';
            
            let pdfDoc = null;
            let pageCount = 0;
            let currentPage = 1;
            let flipbookInitialized = false;
            let isTurning = false;   // FIX: hay un giro animándose
            let dragStart = null;    // FIX: para distinguir clic de arrastre
            
            pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
                pdfDoc = pdf;
                pageCount = pdf.numPages;
                $('#total-pages').text(pageCount);
                createFlipbookPages(pdfDoc);
            }).catch(function(error) {
                console.error('Error cargando PDF:', error);
                $('.loading').text('Error al cargar el PDF').css('background', 'rgba(255,0,0,0.7)');
            });
            
            function createFlipbookPages(pdf) {
                const flipbook = $('#flipbook');
                flipbook.empty();
                // FIX: ya NO se añaden .hover-indicator dentro del flipbook
                
                const pagePromises = [];
                
                for (let pageNum = 1; pageNum <= pageCount; pageNum++) {
                    pagePromises.push(
                        pdf.getPage(pageNum).then(function(page) {
                            const viewport = page.getViewport({ scale: 1.5 });
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            
                            return page.render({
                                canvasContext: context,
                                viewport: viewport
                            }).promise.then(function() {
                                const pageDiv = $('<div>', { class: 'turn-page' });
                                pageDiv.append($('<img>', {
                                    class: 'pdf-page',
                                    src: canvas.toDataURL(),
                                    alt: 'Página ' + pageNum
                                }));
                                return pageDiv;
                            });
                        })
                    );
                }
                
                Promise.all(pagePromises).then(function(pages) {
                    pages.forEach(function(p) { $('#flipbook').append(p); });
                    initializeFlipbook();
                });
            }
            
            function initializeFlipbook() {
                $('#flipbook').turn({
                    width: 800,
                    height: 500,
                    autoCenter: true,
                    acceleration: true,
                    gradients: true,
                    elevation: 50,
                    duration: 600,
                    display: 'double',
                    when: {
                        turning: function(event, page) {
                            isTurning = true;
                            currentPage = page;
                        },
                        turned: function(event, page) {
                            isTurning = false;
                            currentPage = page;
                            updateControls();
                        }
                    }
                });
                
                flipbookInitialized = true;
                $('.loading').remove();
                updateControls();
                setupHoverEffects();
            }
            
            function updateControls() {
                if (!flipbookInitialized) return;
                const page = $('#flipbook').turn('page');
                $('#prev-page').prop('disabled', page <= 1);
                $('#next-page').prop('disabled', page >= pageCount);
                $('#page-info').html('Página ' + page + ' de ' + pageCount);
            }
            
            // FIX: navegación centralizada, ignora la orden si ya hay un giro en curso
            function safeTurn(action) {
                if (!flipbookInitialized || isTurning) return;
                $('#flipbook').turn(action);
            }
            
            function setupHoverEffects() {
                const flipbook = $('#flipbook');
                const wrapper = $('.flipbook-wrapper');
                
                /* FIX principal del bug del click:
                   Turn.js también escucha el mousedown e inicia su propio pliegue.
                   Al soltar, ese pliegue se devuelve animado y, mientras dura,
                   turn.js IGNORA el turn('next')/turn('previous') externo.
                   Solución: cortar el mousedown/touchstart en fase de captura
                   (antes de que llegue a turn.js) SOLO en las zonas de clic. */
                document.addEventListener('mousedown', function(e) {
                    const el = document.getElementById('flipbook');
                    if (!el) return;
                    const r = el.getBoundingClientRect();
                    const x = e.clientX - r.left;
                    const y = e.clientY - r.top;
                    
                    if (x < 0 || x > r.width || y < 0 || y > r.height) {
                        dragStart = null;
                        return;
                    }
                    
                    dragStart = { x: e.clientX, y: e.clientY, moved: false };
                    
                    const threshold = 150; // misma zona que el clic
                    if (x < threshold || x > r.width - threshold) {
                        e.stopPropagation(); // turn.js no inicia su pliegue aquí
                    }
                }, true);
                
                document.addEventListener('touchstart', function(e) {
                    if (!e.touches || !e.touches.length) return;
                    const t = e.touches[0];
                    const r = document.getElementById('flipbook').getBoundingClientRect();
                    const x = t.clientX - r.left;
                    const y = t.clientY - r.top;
                    if (x >= 0 && x <= r.width && y >= 0 && y <= r.height) {
                        const threshold = 150;
                        if (x < threshold || x > r.width - threshold) {
                            e.stopPropagation();
                        }
                    }
                }, true);
                
                // Si el mouse se movió más de 8px, fue arrastre y no clic
                document.addEventListener('mousemove', function(e) {
                    if (dragStart && !dragStart.moved &&
                        (Math.abs(e.clientX - dragStart.x) > 8 ||
                         Math.abs(e.clientY - dragStart.y) > 8)) {
                        dragStart.moved = true;
                    }
                });
                
                // Hover: solo clases visuales sobre el wrapper,
                // nunca transform CSS sobre las páginas de turn.js
                flipbook.on('mousemove', function(e) {
                    if (!flipbookInitialized) return;
                    const rect = this.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const threshold = 100;
                    
                    if (mouseX < threshold && currentPage > 1) {
                        wrapper.addClass('hover-left').removeClass('hover-right');
                    } else if (mouseX > rect.width - threshold && currentPage < pageCount) {
                        wrapper.addClass('hover-right').removeClass('hover-left');
                    } else {
                        wrapper.removeClass('hover-left hover-right');
                    }
                });
                
                flipbook.on('mouseleave', function() {
                    wrapper.removeClass('hover-left hover-right');
                });
                
                // Clic para cambiar de página
                flipbook.on('click', function(e) {
                    if (!flipbookInitialized || isTurning) return;
                    if (dragStart && dragStart.moved) return; // fue arrastre, no clic
                    
                    const rect = this.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const threshold = 150;
                    
                    if (mouseX < threshold && currentPage > 1) {
                        safeTurn('previous');
                    } else if (mouseX > rect.width - threshold && currentPage < pageCount) {
                        safeTurn('next');
                    }
                });
            }
            
            $('#prev-page').on('click', function() { safeTurn('previous'); });
            $('#next-page').on('click', function() { safeTurn('next'); });
            
            $(document).on('keydown', function(e) {
                if (!flipbookInitialized) return;
                if (e.keyCode === 37) { e.preventDefault(); safeTurn('previous'); }
                else if (e.keyCode === 39) { e.preventDefault(); safeTurn('next'); }
            });
        });
    </script>
</body>
</html>

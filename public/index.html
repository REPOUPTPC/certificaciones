    <style>
      :root {
        --primary: #1f5fbf;
        --primary-dark: #163f7a;
        --primary-soft: #eaf3ff;
        --text: #1f2a37;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ffffff 0%, #f4f9ff 45%, #eef6ff 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .hero-card {
        border: none;
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(31, 95, 191, 0.14);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
      }

      .logo-wrap {
        background: linear-gradient(135deg, var(--primary-soft), #ffffff);
        border-radius: 50%;
        width: 190px;
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        box-shadow: 0 12px 30px rgba(31, 95, 191, 0.14);
      }

      .btn-primary-custom {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.7rem;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(31, 95, 191, 0.25);
      }

      .btn-outline-custom {
        border: 2px solid var(--primary);
        color: var(--primary);
        border-radius: 999px;
        padding: 0.9rem 1.7rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .btn-outline-custom:hover {
        background: var(--primary-soft);
        color: var(--primary-dark);
        transform: translateY(-2px);
      }

      .accent-pill {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font-size: 0.9rem;
        font-weight: 600;
      }
    </style>
  </head>

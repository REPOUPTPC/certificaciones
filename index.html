<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificaciones - Inicio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #1f5fbf;
        --primary-dark: #163f7a;
        --primary-soft: #eaf3ff;
        --text: #1f2a37;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ffffff 0%, #f4f9ff 45%, #eef6ff 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .hero-card {
        border: none;
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(31, 95, 191, 0.14);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
      }

      .logo-wrap {
        background: linear-gradient(135deg, var(--primary-soft), #ffffff);
        border-radius: 50%;
        width: 190px;
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        box-shadow: 0 12px 30px rgba(31, 95, 191, 0.14);
      }

      .btn-primary-custom {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.7rem;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(31, 95, 191, 0.25);
      }

      .btn-outline-custom {
        border: 2px solid var(--primary);
        color: var(--primary);
        border-radius: 999px;
        padding: 0.9rem 1.7rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .btn-outline-custom:hover {
        background: var(--primary-soft);
        color: var(--primary-dark);
        transform: translateY(-2px);
      }

      .accent-pill {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font-size: 0.9rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="hero-card p-4 p-md-5 p-lg-5">
            <div class="row align-items-center g-4">
              <div class="col-lg-5 text-center text-lg-start">
                <span class="accent-pill mb-3">Sistema de certificaciones</span>
                <h1 class="display-5 fw-bold mb-3">Gestiona tus certificados con estilo y facilidad</h1>
                <p class="lead text-muted mb-4">
                  Accede rápidamente a la gestión o consulta de certificados desde una portada moderna, clara y profesional.
                </p>
                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
                  <a href="gestion.html" class="btn btn-primary-custom btn-lg">Ir a Gestión</a>
                  <a href="consulta.html" class="btn btn-outline-custom btn-lg">Ir a Consulta</a>
                </div>
              </div>
              <div class="col-lg-7 text-center">
                <div class="logo-wrap mx-auto">
                  <img src="img/CYT.png" alt="Logo CYT" class="img-fluid" style="max-height: 150px;" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
